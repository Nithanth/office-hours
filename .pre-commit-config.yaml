repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
        additional_dependencies: []

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.10

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        exclude: ^(tests/|scripts/|migrations/)
        # Match what CI sees so warn_unused_ignores doesn't disagree with the
        # full-project mypy run.
        additional_dependencies:
          - prometheus-client
          - sqlalchemy
          - types-Markdown
          - types-redis
