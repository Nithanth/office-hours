version: '3.8'

services:
  web:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}" # Uses PORT from .env; Dockerfile defaults to 8000
    volumes:
      - .:/app # Mount current directory to /app in container for live updates
    env_file:
      - .env # Load environment variables from .env file
    environment:
      - PYTHONUNBUFFERED=1 # For seeing logs immediately
