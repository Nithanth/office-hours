[project]
name = "office-hours"
version = "0.1.0"
description = "AI-powered research paper assistant"
requires-python = ">=3.11"
dependencies = [
    # Core Web Framework & Server
    "python-fasthtml~=0.12",
    "uvicorn~=0.38",
    "fastapi~=0.136",
    # Environment & Configuration
    "python-dotenv~=1.1",
    "cryptography>=42",
    # API Clients & HTTP
    "httpx~=0.28",
    "exa-py>=2.25",
    "openai~=2.36",
    "anthropic~=0.53",
    "together~=1.4",
    "google-genai>=1.19,<3.0",
    "xai-sdk~=1.11",
    "google-api-core~=2.25",
    "tenacity~=9.1",
    "loguru~=0.7",
    "nltk~=3.9",
    "sentence-transformers~=5.0",
    "lancedb~=0.6",
    "tiktoken~=0.12",
    "prometheus_client~=0.22",
    "slowapi~=0.1",
    "aiohttp>=3.9",
    "pdfplumber>=0.10",
    "pandas>=2.0",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.31",
    "alembic~=1.13",
    # Data Validation & Modeling
    "pydantic~=2.11",
    "pdfminer.six>=20231228",
    "pymupdf~=1.24",
    "pytesseract~=0.3",
    "pillow>=11.1",
    "readability-lxml~=0.8.4",
    # Document generation
    "python-docx~=1.2",
    # Notion integration
    "notion-client~=3.0",
    "pydantic-settings>=2.14.2",
    # Markdown rendering (research profile output)
    "markdown~=3.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "aiosqlite>=0.22.1",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/migrations/*",
    "src/scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

ignore = [
    "E501",  # Line too long
    "UP007", # Allow Optional[...] syntax
    "UP045", # Allow Optional[...] syntax
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
    "scripts/**",
]

[tool.ruff.format]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
explicit_package_bases = true
exclude = "^(tests/|scripts/|migrations/|venv/|node_modules/|build/|dist/|__pycache__/)"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
