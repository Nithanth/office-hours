[pytest]
addopts = -q
testpaths = tests
asyncio_mode = auto
plugins = pytest_asyncio

markers =
    asyncio: mark a test as asynchronous (handled by pytest-asyncio)
    network: mark a test that performs real network I/O
    integration: mark a long-running integration test

filterwarnings =
    ignore:Unknown config option:pytest.PytestConfigWarning
    ignore::pydantic.PydanticDeprecatedSince20
    ignore::pytest.PytestUnknownMarkWarning
    # Silence Starlette TestClient cookie deprecation during tests
    ignore:Setting per-request cookies.*:DeprecationWarning:starlette\.testclient
    ignore: builtin type SwigPy.* has no __module__:DeprecationWarning
    ignore: builtin type swigvarlink.* has no __module__:DeprecationWarning