<section class="lesson-studio">
  <header>$back<h1>Visual lesson</h1><p>$subject</p></header>
  <div class="lesson-layout">
    <section class="lesson-panel"><h2>$source_heading</h2>
      <form id="lesson-source">
        $source_fields
        <button class="lesson-primary">Generate storyboard</button>
      </form>
      $previous
    </section>
    <section class="lesson-panel"><h2>Storyboard</h2>
      <div id="lesson-empty"><p>Review the narration, visuals, and source for each scene before rendering.</p>$example</div>
      <form id="lesson-editor" hidden><div id="lesson-scenes"></div><button class="lesson-primary">Render video</button></form>
      <p role="status" id="lesson-status"></p>
      <div id="lesson-output" hidden><h2>Playback</h2><video controls playsinline></video><a download="visual-lesson.mp4">Download MP4</a><details><summary>Transcript and sources</summary><div id="lesson-transcript"></div></details></div>
    </section>
  </div>
</section>
